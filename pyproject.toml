[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai"
version = "0.1.0"
description = "Privacy-first local memory CLI (interview prototype)"
requires-python = ">=3.10"
dependencies = ["cryptography>=42", "keyring>=24"]

[project.scripts]
local-ai = "local_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
